<text x="340" y="170" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">On-prem and cloud identity</text>
<line x1="340" y1="188" x2="340" y2="230" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

