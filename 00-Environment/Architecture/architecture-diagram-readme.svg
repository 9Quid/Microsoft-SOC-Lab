<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>SOC lab overview, simplified</title>
<desc>Attack simulation flows through Active Directory and Entra ID, into Defender XDR, into Microsoft Sentinel, through automation into Jira, ending in investigation and remediation.</desc>
