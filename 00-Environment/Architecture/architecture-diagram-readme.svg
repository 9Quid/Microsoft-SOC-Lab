<line x1="340" y1="280" x2="340" y2="322" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="210" y="328" width="260" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
