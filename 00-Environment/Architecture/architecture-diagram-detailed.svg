<title>Detailed SOC lab architecture</title>
<desc>Attack simulation flows through on-premises AD and Entra ID, splitting into Defender XDR and Log Analytics, merging into Sentinel, then through incident creation, Logic App automation, Jira case management, and finally investigation and remediation. Defender for Cloud is shown as a planned, not-yet-built addition.</desc>
